<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YUNGBOARD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--p:#4f46e5;--bg:#f1f5f9;--pn:#fff;--t:#1e293b;--b:#cbd5e1;--d:#ef4444;--s:#10b981;}
body.dark{--p:#818cf8;--bg:#0f172a;--pn:#1e293b;--t:#f8fafc;--b:#334155;}
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:var(--bg);overflow:hidden;color:var(--t)}
#topBar{position:absolute;top:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:6px 10px;background:var(--pn);border-radius:16px;box-shadow:0 4px 15px #0003;z-index:100;align-items:center}
button{border:0;padding:8px;border-radius:8px;cursor:pointer;background:transparent;color:var(--t)}
button:hover{background:#f1f5f9}
button.active{background:#e0e7ff;color:#4f46e5}
#viewport{position:absolute;inset:0}
canvas{display:block;position:absolute;top:0;left:0;touch-action:none}
#cursorsLayer{position:absolute;inset:0;pointer-events:none;z-index:999}
.remote-cursor{position:absolute;transform:translate(-2px,-2px);z-index:999;pointer-events:none}
.cursor-label{position:absolute;top:20px;left:8px;background:var(--p);color:#fff;padding:2px 6px;border-radius:8px;font-size:11px}
#onlineUsers{display:flex;gap:4px;margin-left:10px}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:transform .2s}
.user-avatar:hover{transform:scale(1.2)}
#nameModal{position:fixed;inset:0;background:#0008;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:10000}
.modal-content{background:var(--pn);padding:30px;border-radius:20px;text-align:center;box-shadow:0 10px 30px #0005}
.modal-content input{width:100%;padding:12px;border-radius:8px;border:2px solid var(--b);background:var(--bg);color:var(--t);margin-bottom:15px;text-align:center;font-size:16px}
.modal-content button{background:var(--p);color:#fff;padding:12px;border-radius:8px;width:100%;cursor:pointer}
#loadingScreen{position:fixed;inset:0;background:var(--bg);z-index:20000;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spinner{width:40px;height:40px;border:4px solid var(--b);border-top:4px solid var(--p);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loadingScreen"><div class="spinner"></div><p>Подключение...</p></div>
<div id="nameModal"><div class="modal-content"><h2>Введите имя</h2><input type="text" id="nameInput" placeholder="Имя"><button id="nameSubmit">Войти</button></div></div>
<div id="topBar">
<button id="pen" class="active"><i class="fa-solid fa-pen"></i></button>
<button id="eraser"><i class="fa-solid fa-eraser"></i></button>
<button id="inviteBtn"><i class="fa-solid fa-user-plus"></i></button>
<div id="onlineUsers"></div>
</div>
<div id="viewport"><canvas id="canvas"></canvas><div id="cursorsLayer"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id), socket=io();
const urlParams = new URLSearchParams(location.search);
let room = urlParams.get('room') || 'main';
if(!urlParams.get('room')) history.replaceState(null,'','?room='+room);

let myName = '';
let tool = 'pen';
let drawData = [];
let remoteCursors = {};

const c = $('canvas'), ctx = c.getContext('2d', { alpha: false, desynchronized: true });
const offCanvas = document.createElement('canvas');
const offCtx = offCanvas.getContext('2d');

let offX = 0, offY = 0, scale = 1;
let isDrawing = false;
let lastX = 0, lastY = 0;
let strokeLines = [];
let lastSend = 0;
let myColor = 'hsl(' + Math.floor(Math.random()*360) + ',85%,50%)';

function resize(){
    c.width = window.innerWidth; c.height = window.innerHeight;
    offCanvas.width = c.width; offCanvas.height = c.height;
    render();
}
window.addEventListener('resize', resize); resize();

function getPos(e){
    const r = c.getBoundingClientRect();
    return { x: (e.clientX - r.left - offX) / scale, y: (e.clientY - r.top - offY) / scale };
}

function render(){
    requestAnimationFrame(() => {
        offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
        offCtx.save();
        offCtx.translate(offX, offY);
        offCtx.scale(scale, scale);
        offCtx.lineCap = 'round'; offCtx.lineJoin = 'round';
        drawData.forEach(line => {
            offCtx.beginPath();
            offCtx.strokeStyle = line.color;
            offCtx.lineWidth = line.size;
            offCtx.moveTo(line.x1, line.y1);
            offCtx.lineTo(line.x2, line.y2);
            offCtx.stroke();
        });
        ctx.drawImage(offCanvas, 0, 0);
        offCtx.restore();
    });
}

$('pen').onclick = () => { tool = 'pen'; $('pen').classList.add('active'); $('eraser').classList.remove('active'); };
$('eraser').onclick = () => { tool = 'eraser'; $('eraser').classList.add('active'); $('pen').classList.remove('active'); };

$('inviteBtn').onclick = () => {
    const url = new URL(location.origin + location.pathname);
    url.searchParams.set('room', room);
    const t = document.createElement("textarea"); t.value = url.toString();
    document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove();
    alert('Ссылка скопирована!');
};

c.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    isDrawing = true;
    const p = getPos(e);
    lastX = p.x; lastY = p.y;
    strokeLines = [];
});

c.addEventListener('mousemove', e => {
    if(!isDrawing) return;
    const p = getPos(e);
    const line = {
        id: 's_' + Date.now() + Math.random(),
        x1: lastX, y1: lastY, x2: p.x, y2: p.y,
        color: tool === 'eraser' ? '#ffffff' : '#1e293b',
        size: tool === 'eraser' ? 20 : 3
    };
    drawData.push(line);
    strokeLines.push(line);
    const now = Date.now();
    if(now - lastSend > 33){
        lastSend = now;
        socket.emit('draw', { ...line, room });
    }
    lastX = p.x; lastY = p.y;
    render();
});

window.addEventListener('mouseup', () => {
    if(!isDrawing) return;
    isDrawing = false;
    if(strokeLines.length > 0) socket.emit('draw', { ...strokeLines[strokeLines.length-1], room });
});

socket.on('connect', () => {
    $('loadingScreen').style.display = 'none';
    socket.emit('join', { room, name: myName });
});

socket.on('load_state', data => {
    drawData = data.lines || [];
    remoteCursors = {};
    if(data.camera){
        offX = data.camera.offX; offY = data.camera.offY; scale = data.camera.scale;
    }
    render();
});

socket.on('draw', line => { drawData.push(line); render(); });

socket.on('cursor_move', data => {
    let el = remoteCursors[data.sender];
    if(!el){
        el = document.createElement('div');
        el.className = 'remote-cursor';
        el.innerHTML = `<div class="cursor-label" style="background:${data.color}">${data.name}</div>`;
        $('cursorsLayer').appendChild(el);
        remoteCursors[data.sender] = el;
    }
    el.style.left = (data.x * scale + offX) + 'px';
    el.style.top = (data.y * scale + offY) + 'px';
});

socket.on('users_update', users => {
    const box = $('onlineUsers'); box.innerHTML = '';
    Object.entries(users).forEach(([sid, name]) => {
        const el = document.createElement('div');
        el.className = 'user-avatar'; el.textContent = name[0];
        el.title = name;
        el.onclick = () => {
            // Телепорт
        };
        box.appendChild(el);
    });
});

let lastCursorSend = 0;
window.addEventListener('mousemove', e => {
    const now = Date.now();
    if(now - lastCursorSend > 40){
        lastCursorSend = now;
        const p = getPos(e);
        socket.emit('cursor_move', { x: p.x, y: p.y, color: myColor, name: myName, room });
    }
});

$('nameSubmit').onclick = () => {
    myName = $('nameInput').value.trim() || 'Гость';
    $('nameModal').style.display = 'none';
    socket.emit('join', { room, name: myName });
};
</script>
</body>
</html>
